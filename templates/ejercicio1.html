<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Formulario de Notas</h1>

    <form method="POST">
        <label>Nota 1:</label>
        <input type="number" name="nota1" min="10" max="70" step="any" required>

        <label>Nota 2:</label>
        <input type="number" name="nota2" min="10" max="70" step="any" required>

        <label>Nota 3:</label>
        <input type="number" name="nota3" min="10" max="70" step="any" required>

        <label>Asistencia (%):</label>
        <input type="number" name="asistencia" min="0" max="100" step="1" required>

        <button type="submit">Enviar</button>
    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if promedio is defined %}
        <h2>Promedio: {{ promedio }}</h2>

        {% if aprobado %}
            <p>APROBADO</p>
        {% else %}
            <p>REPROBADO</p>
        {% endif %}
    {% endif %}

   

</body>
</html>
